name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not include API keys, proxy URLs, billing details, private source code,
        private prompts, logs, or customer data.
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Landing
        - Dashboard
        - Billing
        - Proxy
        - Codex
        - Claude
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the broken behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, CLI, model, or agent version when relevant.
      placeholder: "Chrome 126, macOS 15, Codex CLI ..."
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or sanitized logs
      description: Only include data that is safe to share publicly.
    validations:
      required: false
